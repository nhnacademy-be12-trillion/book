<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 도서 등록 시스템 (Admin)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.8);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .book-cover {
            max-width: 200px;
            max-height: 280px;
            object-fit: cover;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .cursor-pointer { cursor: pointer; }
        .cursor-pointer:hover { background-color: #f8f9fa; }
    </style>
</head>
<body class="bg-light">

<div id="loading" class="loading-overlay">
    <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;"></div>
    <h4 class="mt-3 text-primary">AI가 도서 정보를 분석 중입니다...</h4>
    <p class="text-muted">잠시만 기다려주세요 (약 3~5초 소요)</p>
</div>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h3 class="mb-0">🤖 AI 도서 등록 시스템 (Admin)</h3>
                </div>
                <div class="card-body">

                    <div class="input-group mb-4">
                        <input type="text" id="isbnInput" class="form-control form-control-lg" placeholder="ISBN 13자리를 입력하세요">
                        <button class="btn btn-dark btn-lg" type="button" onclick="fetchBookInfo()">
                            🔍 AI 검색
                        </button>
                    </div>

                    <hr>

                    <form id="bookForm">
                        <div class="row mb-3">
                            <div class="col-md-4 text-center">
                                <img id="previewImage" src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/65/No-Image-Placeholder.svg/150px-No-Image-Placeholder.svg.png" class="book-cover img-fluid rounded mb-2">
                                <input type="hidden" id="bookImage">
                                <div class="mt-2">
                                    <label for="fileInput" class="form-label text-sm text-muted">직접 이미지 업로드</label>
                                    <input class="form-control form-control-sm" type="file" id="fileInput" accept="image/*" onchange="previewFile()">
                                </div>
                            </div>

                            <div class="col-md-8">
                                <div class="mb-3">
                                    <label class="form-label">ISBN</label>
                                    <input type="text" class="form-control" id="isbn" readonly>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">도서명</label>
                                    <input type="text" class="form-control fw-bold" id="bookName">
                                </div>
                                <div class="row mb-3">
                                    <div class="col">
                                        <label class="form-label">출판사</label>
                                        <input type="text" class="form-control" id="bookPublisher">
                                    </div>
                                    <div class="col">
                                        <label class="form-label">작가</label>
                                        <input type="text" class="form-control" id="bookAuthor">
                                    </div>
                                    <div class="col">
                                        <label class="form-label">출판일</label>
                                        <input type="date" class="form-control" id="bookPublicationDate">
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-bold text-info"># 태그</label>
                                    <input type="hidden" id="tags">
                                    <input type="text" class="form-control" id="tagInput" placeholder="태그 입력 후 엔터" autocomplete="off">
                                    <div id="tagContainer" class="d-flex flex-wrap gap-2 mt-2"></div>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-bold">📂 카테고리</label>
                                    <div class="position-relative">
                                        <input type="text" class="form-control" id="categorySearch" placeholder="카테고리명 검색 (예: 소설)" autocomplete="off">
                                        <ul id="categoryResults" class="list-group position-absolute w-100" style="z-index: 1000; display: none; max-height: 200px; overflow-y: auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1);"></ul>
                                    </div>
                                    <div id="selectedCategoriesContainer" class="d-flex flex-wrap gap-2 mt-2"></div>
                                </div>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col">
                                <label class="form-label">정가</label>
                                <input type="number" class="form-control" id="bookRegularPrice">
                            </div>
                            <div class="col">
                                <label class="form-label">판매가</label>
                                <input type="number" class="form-control" id="bookSalePrice">
                            </div>
                            <div class="col">
                                <label class="form-label">재고</label>
                                <input type="number" class="form-control" id="bookStock" value="10">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold text-primary">✨ 책 소개</label>
                            <textarea class="form-control" id="bookDescription" rows="5"></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold text-success">📚 목차</label>
                            <textarea class="form-control" id="bookIndex" rows="6"></textarea>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="button" class="btn btn-primary btn-lg" onclick="registerBook()">
                                도서 등록 완료
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // ==========================================
    // [핵심 경로 설정]
    // 1. AdminBookController: 도서 관련 (/api/admin/books)
    // 2. CategoryAdminController: 카테고리 관련 (/api/admin/categories)
    // ==========================================
    const BOOK_API_URL = 'http://localhost:10413/api/admin/books';
    const CATEGORY_API_URL = 'http://localhost:10413/api/admin/categories';

    // ==========================================
    // 1. AI 도서 검색 (AdminBookController 호출)
    // ==========================================
    async function fetchBookInfo() {
        const isbn = document.getElementById('isbnInput').value;
        if (!isbn) { alert('ISBN을 입력해주세요!'); return; }

        document.getElementById('loading').style.display = 'flex';
        document.getElementById('fileInput').value = '';

        try {
            // AdminBookController의 @GetMapping("/isbn/{isbn}") 호출
            const response = await fetch(`${BOOK_API_URL}/isbn/${isbn}`);
            if (!response.ok) throw new Error('도서 정보를 찾을 수 없습니다.');

            const data = await response.json();
            fillForm(data);
        } catch (error) {
            alert(error.message);
        } finally {
            document.getElementById('loading').style.display = 'none';
        }
    }

    // 폼 채우기 함수
    function fillForm(data) {
        document.getElementById('isbn').value = data.isbn || '';
        document.getElementById('bookName').value = data.bookName || '';
        document.getElementById('bookPublisher').value = data.bookPublisher || '';
        document.getElementById('bookAuthor').value = data.bookAuthor || '';
        document.getElementById('bookPublicationDate').value = data.bookPublicationDate || '';
        document.getElementById('bookRegularPrice').value = data.bookRegularPrice || 0;
        document.getElementById('bookSalePrice').value = data.bookSalePrice || 0;
        document.getElementById('bookDescription').value = data.bookDescription || '';
        document.getElementById('bookIndex').value = data.bookIndex || '';

        // 태그 처리
        tagList = []; document.getElementById('tagContainer').innerHTML = '';
        if (data.tags) data.tags.split(',').forEach(t => addTag(t.trim()));

        // 이미지 처리
        const imgUrl = data.bookImage || '';
        document.getElementById('bookImage').value = imgUrl;
        document.getElementById('previewImage').src = imgUrl || "https://upload.wikimedia.org/wikipedia/commons/thumb/6/65/No-Image-Placeholder.svg/150px-No-Image-Placeholder.svg.png";
    }

    // 파일 미리보기
    function previewFile() {
        const fileInput = document.getElementById('fileInput');
        const preview = document.getElementById('previewImage');
        const file = fileInput.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onloadend = function () { preview.src = reader.result; }
            reader.readAsDataURL(file);
            document.getElementById('bookImage').value = ''; // 직접 올리면 기존 URL 무효화
        }
    }

    // ==========================================
    // 2. 태그 관리
    // ==========================================
    const tagInput = document.getElementById('tagInput');
    let tagList = [];

    tagInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            addTag(this.value.trim());
        }
    });

    function addTag(text) {
        if (!text || tagList.includes(text)) { tagInput.value = ''; return; }
        if (text.includes(',')) { text.split(',').forEach(t => addTag(t.trim())); return; }

        tagList.push(text);
        renderTags();
        tagInput.value = '';
        document.getElementById('tags').value = tagList.join(',');
    }

    function removeTag(text) {
        tagList = tagList.filter(t => t !== text);
        renderTags();
        document.getElementById('tags').value = tagList.join(',');
    }

    function renderTags() {
        const container = document.getElementById('tagContainer');
        container.innerHTML = '';
        tagList.forEach(tag => {
            container.innerHTML += `
                <span class="badge bg-info text-dark fs-6 p-2 d-flex align-items-center">
                    #${tag}
                    <button type="button" class="btn-close ms-2" style="width: 0.5em; height: 0.5em;" onclick="removeTag('${tag}')"></button>
                </span>`;
        });
    }

    // ==========================================
    // 3. 카테고리 검색 (CategoryAdminController 호출)
    // ==========================================
    const categorySearchInput = document.getElementById('categorySearch');
    const categoryResults = document.getElementById('categoryResults');
    let selectedCategories = [];

    categorySearchInput.addEventListener('keyup', async function() {
        const keyword = this.value.trim();
        if (keyword.length < 1) { categoryResults.style.display = 'none'; return; }

        try {
            // ★ CategoryAdminController의 @GetMapping("/search") 호출
            const response = await fetch(`${CATEGORY_API_URL}/search?keyword=${encodeURIComponent(keyword)}`);
            if (response.ok) {
                const categories = await response.json();
                renderCategoryResults(categories);
            }
        } catch (error) { console.error("카테고리 검색 에러", error); }
    });

    function renderCategoryResults(categories) {
        categoryResults.innerHTML = '';
        if (categories.length === 0) { categoryResults.style.display = 'none'; return; }

        categories.forEach(cat => {
            const li = document.createElement('li');
            li.className = 'list-group-item list-group-item-action cursor-pointer';
            li.textContent = cat.categoryName;
            li.onclick = () => {
                addCategory(cat);
                categorySearchInput.value = '';
                categoryResults.style.display = 'none';
            };
            categoryResults.appendChild(li);
        });
        categoryResults.style.display = 'block';
    }

    function addCategory(category) {
        if (selectedCategories.some(c => c.categoryId === category.categoryId)) return;
        selectedCategories.push(category);
        renderSelectedBadges();
    }

    function removeCategory(categoryId) {
        selectedCategories = selectedCategories.filter(c => c.categoryId !== categoryId);
        renderSelectedBadges();
    }

    function renderSelectedBadges() {
        const container = document.getElementById('selectedCategoriesContainer');
        container.innerHTML = '';
        selectedCategories.forEach(cat => {
            container.innerHTML += `
                <span class="badge bg-primary fs-6 p-2 d-flex align-items-center">
                    ${cat.categoryName}
                    <button type="button" class="btn-close btn-close-white ms-2" style="width: 0.5em; height: 0.5em;" onclick="removeCategory(${cat.categoryId})"></button>
                </span>`;
        });
    }

    // ==========================================
    // 4. 최종 도서 등록 (AdminBookController 호출)
    // ==========================================
    async function registerBook() {
        const requestDto = {
            isbn: document.getElementById('isbn').value,
            bookName: document.getElementById('bookName').value,
            bookDescription: document.getElementById('bookDescription').value,
            bookPublisher: document.getElementById('bookPublisher').value,
            bookAuthor: document.getElementById('bookAuthor').value,
            tags: document.getElementById('tags').value,
            categoryIdList: selectedCategories.map(c => c.categoryId),
            bookPublicationDate: document.getElementById('bookPublicationDate').value,
            bookIndex: document.getElementById('bookIndex').value,
            bookPackaging: true,
            bookState: "ON_SALE",
            bookStock: parseInt(document.getElementById('bookStock').value) || 0,
            bookRegularPrice: parseInt(document.getElementById('bookRegularPrice').value) || 0,
            bookSalePrice: parseInt(document.getElementById('bookSalePrice').value) || 0,
            bookImage: document.getElementById('bookImage').value
        };

        const formData = new FormData();
        const jsonBlob = new Blob([JSON.stringify(requestDto)], { type: "application/json" });
        formData.append("book", jsonBlob);

        const fileInput = document.getElementById('fileInput');
        if (fileInput && fileInput.files.length > 0) {
            formData.append("file", fileInput.files[0]);
        }

        try {
            // AdminBookController의 @PostMapping 호출
            const response = await fetch(BOOK_API_URL, {
                method: 'POST',
                body: formData
            });

            if (response.ok) {
                alert('🎉 도서가 성공적으로 등록되었습니다!');
                location.reload();
            } else {
                const errorText = await response.text();
                alert('등록 실패!\n' + errorText);
            }
        } catch (error) {
            alert('서버 통신 오류: ' + error.message);
        }
    }
</script>
</body>
</html>
