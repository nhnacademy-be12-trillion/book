<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>카테고리 테스트 (Port: 10413)</title>
  <style>
    body { font-family: 'Malgun Gothic', sans-serif; padding: 20px; display: flex; gap: 30px; background-color: #f9f9f9; }
    .box { border: 1px solid #ddd; padding: 20px; width: 45%; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); background-color: #fff; }
    h3 { border-bottom: 2px solid #4CAF50; padding-bottom: 10px; margin-top: 0; color: #333; }
    ul { list-style-type: none; padding-left: 20px; }
    .caret { cursor: pointer; user-select: none; font-weight: bold; color: #333; }
    .caret:hover { color: #4CAF50; }
    .caret::before { content: "▶"; color: #4CAF50; display: inline-block; margin-right: 6px; font-size: 12px; transition: transform 0.2s; }
    .caret-down::before { transform: rotate(90deg); }
    .nested { display: none; margin-top: 5px;}
    .active { display: block; }
    .leaf { color: #666; margin-left: 18px; font-size: 0.95em; }
    input { width: 100%; padding: 12px; margin-bottom: 15px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 4px; }
    .search-item { padding: 8px; border-bottom: 1px solid #eee; font-size: 0.9em; }
    button { background-color: #4CAF50; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>

<div class="box">
  <h3>📂 전체 카테고리 트리</h3>
  <button onclick="loadTree()">데이터 새로고침</button>
  <div id="tree-root" style="margin-top: 15px;">로딩 대기중...</div>
</div>

<div class="box">
  <h3>🔍 카테고리 검색</h3>
  <input type="text" id="searchInput" placeholder="검색어 입력" onkeyup="search()">
  <div id="search-results"></div>
</div>

<script>
  const API_BASE = 'http://localhost:10413/api/books/categories';

  async function loadTree() {
    const root = document.getElementById('tree-root');
    root.innerHTML = '데이터 조회중...';
    try {
      const res = await fetch(API_BASE);
      if (!res.ok) throw new Error(`HTTP 에러! 상태: ${res.status}`);
      let data = await res.json();

      // 데이터 구조 변경
      data = reorganizeData(data);

      root.innerHTML = '';
      if (data.length === 0) root.innerHTML = '데이터가 없습니다.';
      else root.appendChild(createTree(data));
    } catch (e) {
      root.innerHTML = `<span style="color:red">⚠️ 에러: ${e.message}</span>`;
    }
  }

  // 🔹 데이터 재구성 함수 (수정됨)
  function reorganizeData(nodes) {
    // '일반 예술'로 묶고 싶은 키워드들
    const targetKeywords = [
      "미술이론", "미술재료", "미술사전", "미술주제", "미술간행물",
      "미술단체", "미술지도법", "미술전집", "미술사"
    ];

    return nodes.map(node => {
      // 1. 하위 처리 (Bottom-up)
      if (node.children && node.children.length > 0) {
        node.children = reorganizeData(node.children);
      }

      // 2. 부모가 '예술'인 경우 분리 작업 시작
      if (node.categoryName.includes("예술") && node.categoryName !== "일반 예술") {

        const generalArtChildren = [];
        const siblingChildren = [];

        if (node.children) {
          node.children.forEach(child => {
            // 미술 관련 키워드이거나 '미술'로 시작하면 -> 일반 예술로
            if (targetKeywords.includes(child.categoryName) || child.categoryName.startsWith("미술")) {
              generalArtChildren.push(child);
            } else {
              // 건축, 조각, 공예 등 -> 형제(Sibling)로 유지
              siblingChildren.push(child);
            }
          });
        }

        // 묶을 게 있다면 '일반 예술' 생성 후 병합
        if (generalArtChildren.length > 0) {
          const generalArtNode = {
            categoryId: `virtual-general-${node.categoryId}`,
            categoryName: "일반 예술",
            children: generalArtChildren
          };
          // 순서: [일반 예술] -> [건축] -> [공예] ...
          node.children = [generalArtNode, ...siblingChildren];
        }
      }
      return node;
    });
  }

  function createTree(nodes) {
    const ul = document.createElement('ul');
    nodes.forEach(node => {
      const li = document.createElement('li');
      if (node.children && node.children.length > 0) {
        const span = document.createElement('span');
        span.className = 'caret';
        span.innerText = node.categoryName;
        span.onclick = function() {
          this.parentElement.querySelector('.nested').classList.toggle('active');
          this.classList.toggle('caret-down');
        };
        li.appendChild(span);
        const childrenUl = createTree(node.children);
        childrenUl.className = 'nested';
        li.appendChild(childrenUl);
      } else {
        const span = document.createElement('span');
        span.className = 'leaf';
        span.innerText = node.categoryName;
        li.appendChild(span);
      }
      ul.appendChild(li);
    });
    return ul;
  }

  async function search() {
    const keyword = document.getElementById('searchInput').value;
    const resultBox = document.getElementById('search-results');
    if (keyword.length < 1) { resultBox.innerHTML = ''; return; }
    try {
      const res = await fetch(`${API_BASE}/search?keyword=${keyword}`);
      const data = await res.json();
      resultBox.innerHTML = '';
      if (data.length === 0) {
        resultBox.innerHTML = '<div style="color:#999; padding:5px;">검색 결과 없음</div>';
        return;
      }
      data.forEach(item => {
        const div = document.createElement('div');
        div.className = 'search-item';
        div.innerText = `[ID: ${item.categoryId}] ${item.categoryName}`;
        resultBox.appendChild(div);
      });
    } catch (e) { console.error(e); }
  }

  loadTree();
</script>
</body>
</html>
